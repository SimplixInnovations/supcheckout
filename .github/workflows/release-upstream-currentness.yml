name: Release Upstream Currentness

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  currentness:
    name: Query official upstream release metadata
    runs-on: ubuntu-latest
    env:
      EVIDENCE_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EVIDENCE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require exact-head checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SOURCE_SHA"
          echo "EVIDENCE SOURCE:"
          git rev-parse HEAD
      - name: Run currentness comparison (fail closed)
        run: |
          set -euo pipefail
          python3 scripts/check-release-upstream-currentness.py \
            --wp-certified 6.9.10,7.0.7,7.1.3 \
            --wc-certified 10.8.1,11.0.1,11.1.2 \
            | tee upstream-currentness.txt
      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-currentness
          path: upstream-currentness.txt
