name: WordPress.org Submission Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'supcheckout.php'
      - 'UPayments.php'
      - 'readme.txt'
      - 'LICENSE'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'NOTICE.md'
      - 'SECURITY.md'
      - 'src/**'
      - 'includes/**'
      - 'assets/**'
      - 'templates/**'
      - 'index.php'
      - 'uninstall.php'
      - '.distignore'
      - 'scripts/build-release.sh'
      - 'scripts/verify-release.sh'
      - 'tests/harness/release-artifact-harness.php'
      - 'tests/harness/wordpress-org-submission-harness.php'
      - '.github/workflows/release-artifact.yml'
      - '.github/workflows/wordpress-org-submission-check.yml'
  push:
    branches: [main]
    paths:
      - 'supcheckout.php'
      - 'UPayments.php'
      - 'readme.txt'
      - 'LICENSE'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'NOTICE.md'
      - 'SECURITY.md'
      - 'src/**'
      - 'includes/**'
      - 'assets/**'
      - 'templates/**'
      - 'index.php'
      - 'uninstall.php'
      - '.distignore'
      - 'scripts/build-release.sh'
      - 'scripts/verify-release.sh'
      - 'tests/harness/release-artifact-harness.php'
      - 'tests/harness/wordpress-org-submission-harness.php'
      - '.github/workflows/release-artifact.yml'
      - '.github/workflows/wordpress-org-submission-check.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUBMISSION_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: wporg-submission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: Plugin Check — canonical SUPCheckout package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBMISSION_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
          tools: none

      - name: Verify permanent submission contract
        run: php tests/harness/wordpress-org-submission-harness.php

      - name: Build and unpack canonical verified package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf submission-output "${RUNNER_TEMP}/plugin-check"
          mkdir -p submission-output "${RUNNER_TEMP}/plugin-check"
          bash scripts/build-release.sh submission-output
          ZIP="$(find submission-output -maxdepth 1 -type f -name 'supcheckout-*.zip' -print -quit)"
          test -n "$ZIP"
          bash scripts/verify-release.sh "$ZIP"
          unzip -q "$ZIP" -d "${RUNNER_TEMP}/plugin-check"
          test -s "${RUNNER_TEMP}/plugin-check/supcheckout/supcheckout.php"
          # The header-less transitional shim is part of the Plugin Check target too.
          test -s "${RUNNER_TEMP}/plugin-check/supcheckout/UPayments.php"
          test -s "${RUNNER_TEMP}/plugin-check/supcheckout/readme.txt"

      - name: Run official WordPress Plugin Check against packaged artifact
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ${{ runner.temp }}/plugin-check/supcheckout
          slug: supcheckout
          categories: plugin_repo
          include-experimental: false
          strict: true
