name: Release Artifact

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.distignore'
      - 'UPayments.php'
      - 'readme.txt'
      - 'src/**'
      - 'includes/**'
      - 'assets/**'
      - 'templates/**'
      - 'index.php'
      - 'uninstall.php'
      - 'LICENSE'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'NOTICE.md'
      - 'SECURITY.md'
      - 'scripts/build-release.sh'
      - 'scripts/verify-release.sh'
      - 'scripts/install-wp-test-environment.sh'
      - 'tests/harness/release-artifact-harness.php'
      - 'tests/integration/**'
      - '.github/workflows/release-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: release-artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-build:
    name: Deterministic SUPCheckout release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
          tools: none

      - name: Release artifact contract
        run: php tests/harness/release-artifact-harness.php

      - name: Build canonical release evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-output
          mkdir -p release-output
          bash scripts/build-release.sh release-output
          ZIP="$(find release-output -maxdepth 1 -type f -name 'supcheckout-*.zip' -print -quit)"
          test -n "$ZIP"
          bash scripts/verify-release.sh "$ZIP"

      - name: Upload canonical release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supcheckout-release-${{ env.RELEASE_SOURCE_SHA }}
          path: |
            release-output/supcheckout-*.zip
            release-output/supcheckout-*.zip.sha256
            release-output/supcheckout-*.manifest.sha256
          if-no-files-found: error
          retention-days: 7

  cross-platform-build:
    name: Cross-platform build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: zip
          coverage: none
          tools: none

      - name: Build and verify exact candidate
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v python3 >/dev/null 2>&1; then
            SHIM_DIR="${TMPDIR:-/tmp}/supcheckout-python3-shim"
            mkdir -p "$SHIM_DIR"
            cat > "$SHIM_DIR/python3" <<'EOF'
          #!/usr/bin/env bash
          exec python "$@"
          EOF
            chmod +x "$SHIM_DIR/python3"
            export PATH="$SHIM_DIR:$PATH"
          fi

          python3 --version
          rm -rf cross-platform-output cross-platform-evidence
          mkdir -p cross-platform-output cross-platform-evidence
          bash scripts/build-release.sh cross-platform-output
          ZIP="$(find cross-platform-output -maxdepth 1 -type f -name 'supcheckout-*.zip' -print -quit)"
          test -n "$ZIP"
          bash scripts/verify-release.sh "$ZIP"
          cp "$ZIP.sha256" "cross-platform-evidence/${RUNNER_OS}.zip.sha256"
          MANIFEST="$(find cross-platform-output -maxdepth 1 -type f -name 'supcheckout-*.manifest.sha256' -print -quit)"
          test -n "$MANIFEST"
          cp "$MANIFEST" "cross-platform-evidence/${RUNNER_OS}.manifest.sha256"

      - name: Upload cross-platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supcheckout-cross-platform-${{ runner.os }}-${{ env.RELEASE_SOURCE_SHA }}
          path: cross-platform-evidence/
          if-no-files-found: error
          retention-days: 7

  cross-platform-determinism:
    name: Cross-platform deterministic release
    needs: [artifact-build, cross-platform-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download canonical release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supcheckout-release-${{ env.RELEASE_SOURCE_SHA }}
          path: canonical

      - name: Download Linux evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supcheckout-cross-platform-Linux-${{ env.RELEASE_SOURCE_SHA }}
          path: linux

      - name: Download Windows evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supcheckout-cross-platform-Windows-${{ env.RELEASE_SOURCE_SHA }}
          path: windows

      - name: Require byte-identical package evidence
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_SIDECAR="$(find canonical -maxdepth 1 -type f -name 'supcheckout-*.zip.sha256' -print -quit)"
          CANONICAL_MANIFEST="$(find canonical -maxdepth 1 -type f -name 'supcheckout-*.manifest.sha256' -print -quit)"
          test -n "$CANONICAL_SIDECAR"
          test -n "$CANONICAL_MANIFEST"
          cat "$CANONICAL_SIDECAR"
          cat linux/Linux.zip.sha256
          cat windows/Windows.zip.sha256
          cmp "$CANONICAL_SIDECAR" linux/Linux.zip.sha256
          cmp "$CANONICAL_SIDECAR" windows/Windows.zip.sha256
          cmp "$CANONICAL_MANIFEST" linux/Linux.manifest.sha256
          cmp "$CANONICAL_MANIFEST" windows/Windows.manifest.sha256

  packaged-runtime:
    name: Packaged WP 7.1 / WC 11.1.0 / PHP 8.3 / ${{ matrix.storage }}
    needs: artifact-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        storage: [legacy, hpos]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, mysqli, zip
          coverage: none
          tools: none

      - name: Download exact built release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supcheckout-release-${{ env.RELEASE_SOURCE_SHA }}
          path: release-output

      - name: Verify downloaded release artifact
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find release-output -maxdepth 1 -type f -name 'supcheckout-*.zip' -print -quit)"
          test -n "$ZIP"
          bash scripts/verify-release.sh "$ZIP"

      - name: Install pinned WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 120 https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /tmp/wp-cli.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum -c -
          chmod +x /tmp/wp-cli.phar
          /tmp/wp-cli.phar --version

      - name: Install packaged SUPCheckout into real WordPress and WooCommerce
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find "$GITHUB_WORKSPACE/release-output" -maxdepth 1 -type f -name 'supcheckout-*.zip' -print -quit)"
          test -n "$ZIP"
          SUPCHECKOUT_PLUGIN_ZIP="$ZIP" \
          WP_CLI_BIN=/tmp/wp-cli.phar \
          bash scripts/install-wp-test-environment.sh 7.1.2 11.1.2 "$RUNNER_TEMP/wordpress"

      - name: Seed malformed protected settings for packaged plugin
        env:
          SUPCHECKOUT_CERT_PHASE: seed
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/PluginActivationTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Activate packaged SUPCheckout
        run: /tmp/wp-cli.phar plugin activate supcheckout --path="$RUNNER_TEMP/wordpress"

      - name: Verify packaged activation and Classic registration
        env:
          SUPCHECKOUT_CERT_PHASE: verify
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/PluginActivationTest.php" --path="$RUNNER_TEMP/wordpress"

      # B-X1 regression: the activation sentinel deliberately leaves a stdClass
      # payload at woocommerce_upayments_settings. Reset to a clean canonical
      # state BEFORE the malformed-gateway-settings regression runs, then
      # exercise the live woocommerce_available_payment_gateways filter over
      # each malformed shape and assert it fails closed without mutating
      # storage. The verify phase ends by restoring the clean canonical
      # state so every subsequent packaged-runtime test sees a configured,
      # array-shaped settings option.
      - name: Seed clean canonical gateway settings for B-X1 regression
        env:
          SUPCHECKOUT_CERT_PHASE: seed
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/MalformedGatewaySettingsTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify packaged malformed gateway settings fail closed
        env:
          SUPCHECKOUT_CERT_PHASE: verify
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/MalformedGatewaySettingsTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify packaged release support metadata
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/ReleaseMetadataTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify packaged Blocks registration and availability
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/CheckoutRegistrationTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Select packaged authoritative order store
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.storage }}" == "hpos" ]]; then
            /tmp/wp-cli.phar option update woocommerce_custom_orders_table_enabled yes --path="$RUNNER_TEMP/wordpress"
          else
            /tmp/wp-cli.phar option update woocommerce_custom_orders_table_enabled no --path="$RUNNER_TEMP/wordpress"
          fi
          /tmp/wp-cli.phar option update woocommerce_custom_orders_table_data_sync_enabled no --path="$RUNNER_TEMP/wordpress"
          /tmp/wp-cli.phar cache flush --path="$RUNNER_TEMP/wordpress"

      - name: Verify packaged order CRUD
        env:
          SUPCHECKOUT_HPOS_MODE: ${{ matrix.storage }}
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/HposCompatibilityTest.php" --path="$RUNNER_TEMP/wordpress"

  package-identity-migration:
    name: ${{ matrix.previous_slug }} → SUPCheckout WP ${{ matrix.wordpress }} / WC ${{ matrix.woocommerce }} / PHP 8.3
    needs: artifact-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '7.1'
            woocommerce: '11.1.0'
            previous_sha: '54b1fbcc280b92372bd93baf929d6a746cfd3959'
            previous_slug: 'simplixpay-upayments'
            previous_text_domain: 'upayments'
          - wordpress: '6.9.7'
            woocommerce: '10.8.1'
            previous_sha: '54b1fbcc280b92372bd93baf929d6a746cfd3959'
            previous_slug: 'simplixpay-upayments'
            previous_text_domain: 'upayments'
          - wordpress: '7.1'
            woocommerce: '11.1.0'
            previous_sha: 'e9f953b0c3a881ad2d4b74390d0b5394b766a3fa'
            previous_slug: 'sucheckout-upayments'
            previous_text_domain: 'sucheckout-upayments'
          - wordpress: '6.9.7'
            woocommerce: '10.8.1'
            previous_sha: 'e9f953b0c3a881ad2d4b74390d0b5394b766a3fa'
            previous_slug: 'sucheckout-upayments'
            previous_text_domain: 'sucheckout-upayments'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      UPGRADE_BASE_SHA: ${{ matrix.previous_sha }}
      SUPCHECKOUT_LEGACY_SLUG: ${{ matrix.previous_slug }}
      SUPCHECKOUT_LEGACY_TEXT_DOMAIN: ${{ matrix.previous_text_domain }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, mysqli, zip
          coverage: none
          tools: none

      - name: Download canonical SUPCheckout artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supcheckout-release-${{ env.RELEASE_SOURCE_SHA }}
          path: release-output

      - name: Verify canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_ZIP="$(find "$GITHUB_WORKSPACE/release-output" -maxdepth 1 -type f -name 'supcheckout-*.zip' -print -quit)"
          test -n "$CURRENT_ZIP"
          bash scripts/verify-release.sh "$CURRENT_ZIP"
          echo "CURRENT_ZIP=$CURRENT_ZIP" >> "$GITHUB_ENV"

      - name: Build pre-stable candidate
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_SOURCE="$RUNNER_TEMP/pre-stable-previous-source"
          PREVIOUS_OUTPUT="$RUNNER_TEMP/pre-stable-previous-output"
          rm -rf "$PREVIOUS_SOURCE" "$PREVIOUS_OUTPUT"
          git worktree add --detach "$PREVIOUS_SOURCE" "$UPGRADE_BASE_SHA"
          mkdir -p "$PREVIOUS_OUTPUT"
          (
            cd "$PREVIOUS_SOURCE"
            bash scripts/build-release.sh "$PREVIOUS_OUTPUT"
          )
          git worktree remove --force "$PREVIOUS_SOURCE"
          git worktree prune
          PREVIOUS_ZIP="$(find "$PREVIOUS_OUTPUT" -maxdepth 1 -type f -name "${SUPCHECKOUT_LEGACY_SLUG}-*.zip" -print -quit)"
          test -n "$PREVIOUS_ZIP"
          echo "PREVIOUS_ZIP=$PREVIOUS_ZIP" >> "$GITHUB_ENV"

      - name: Install pinned WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 120 https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /tmp/wp-cli.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum -c -
          chmod +x /tmp/wp-cli.phar
          /tmp/wp-cli.phar --version

      - name: Install pre-stable package as existing active installation
        shell: bash
        run: |
          set -euo pipefail
          SUPCHECKOUT_PLUGIN_ZIP="$PREVIOUS_ZIP" \
          SUPCHECKOUT_PLUGIN_SLUG="$SUPCHECKOUT_LEGACY_SLUG" \
          WP_CLI_BIN=/tmp/wp-cli.phar \
          bash scripts/install-wp-test-environment.sh "${{ matrix.wordpress }}" "${{ matrix.woocommerce }}" "$RUNNER_TEMP/wordpress"
          /tmp/wp-cli.phar plugin activate "$SUPCHECKOUT_LEGACY_SLUG" --path="$RUNNER_TEMP/wordpress"

      - name: Seed pre-stable merchant state
        env:
          SUPCHECKOUT_UPGRADE_PHASE: seed-existing
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/UpgradeCompatibilityTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Deactivate pre-stable package before identity migration
        run: /tmp/wp-cli.phar plugin deactivate "$SUPCHECKOUT_LEGACY_SLUG" --path="$RUNNER_TEMP/wordpress"

      - name: Install and activate canonical SUPCheckout package
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp-cli.phar plugin install "$CURRENT_ZIP" --force --path="$RUNNER_TEMP/wordpress"
          /tmp/wp-cli.phar plugin activate supcheckout --path="$RUNNER_TEMP/wordpress"

      - name: Verify canonical migration preserves legacy merchant data
        env:
          SUPCHECKOUT_UPGRADE_PHASE: verify-canonical
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/UpgradeCompatibilityTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Prove rollback remains non-destructive
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp-cli.phar plugin deactivate supcheckout --path="$RUNNER_TEMP/wordpress"
          /tmp/wp-cli.phar plugin activate "$SUPCHECKOUT_LEGACY_SLUG" --path="$RUNNER_TEMP/wordpress"
          SUPCHECKOUT_UPGRADE_PHASE=verify-legacy-rollback \
            /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/UpgradeCompatibilityTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Return to canonical SUPCheckout and remove legacy package
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp-cli.phar plugin deactivate "$SUPCHECKOUT_LEGACY_SLUG" --path="$RUNNER_TEMP/wordpress"
          /tmp/wp-cli.phar plugin activate supcheckout --path="$RUNNER_TEMP/wordpress"
          /tmp/wp-cli.phar plugin delete "$SUPCHECKOUT_LEGACY_SLUG" --path="$RUNNER_TEMP/wordpress"
          SUPCHECKOUT_UPGRADE_PHASE=verify-canonical-final \
            /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/UpgradeCompatibilityTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Clean migration certification fixtures
        env:
          SUPCHECKOUT_UPGRADE_PHASE: cleanup
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/UpgradeCompatibilityTest.php" --path="$RUNNER_TEMP/wordpress"

  release-gate:
    name: Release Gate
    if: ${{ always() }}
    needs: [artifact-build, cross-platform-determinism, packaged-runtime, package-identity-migration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete release certification
        env:
          ARTIFACT_RESULT: ${{ needs.artifact-build.result }}
          CROSS_PLATFORM_RESULT: ${{ needs.cross-platform-determinism.result }}
          PACKAGED_RUNTIME_RESULT: ${{ needs.packaged-runtime.result }}
          PACKAGE_MIGRATION_RESULT: ${{ needs.package-identity-migration.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ARTIFACT_RESULT" = "success"
          test "$CROSS_PLATFORM_RESULT" = "success"
          test "$PACKAGED_RUNTIME_RESULT" = "success"
          test "$PACKAGE_MIGRATION_RESULT" = "success"
