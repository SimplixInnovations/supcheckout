name: Provider Sandbox Certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'UPayments.php'
      - 'src/Provider/**'
      - 'src/Payment/CheckoutPayload.php'
      - 'src/Payment/CheckoutOrchestrator.php'
      - 'tests/provider/**'
      - '.github/workflows/provider-sandbox-certification.yml'
      - 'docs/project/ENTERPRISE-CERTIFICATION.md'
      - 'docs/project/RELEASE-ENGINEERING.md'
  push:
    branches: [main]
    paths:
      - 'UPayments.php'
      - 'src/Provider/**'
      - 'src/Payment/CheckoutPayload.php'
      - 'src/Payment/CheckoutOrchestrator.php'
      - 'tests/provider/**'
      - '.github/workflows/provider-sandbox-certification.yml'
      - 'docs/project/ENTERPRISE-CERTIFICATION.md'
      - 'docs/project/RELEASE-ENGINEERING.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROVIDER_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: provider-sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  charge-initialization:
    name: Public sandbox Charge initialization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PROVIDER_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: curl
          coverage: none
          tools: none
      - name: Syntax-check provider smoke
        run: php -l tests/provider/sandbox-charge-smoke.php
      - name: Execute one bounded public-sandbox Charge initialization
        env:
          # Historical public sandbox test token used only for a bounded Charge
          # initialization smoke. Confirm against current first-party UPayments
          # sandbox documentation before any production claim. Never substitute
          # a merchant production token.
          SUPCHECKOUT_UPAYMENTS_SANDBOX_TOKEN: jtest123
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: php tests/provider/sandbox-charge-smoke.php
