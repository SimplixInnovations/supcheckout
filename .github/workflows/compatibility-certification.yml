name: Compatibility Certification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPATIBILITY_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  SUPCHECKOUT_PLUGIN_SLUG: supcheckout

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-matrix:
    name: WP ${{ matrix.wordpress }} / WC ${{ matrix.woocommerce }} / PHP ${{ matrix.php }} / ${{ matrix.storage }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        cell:
          - current
          - current-php85
          - current-php84
          - current-php82
          - previous
          - floor-old-wc
          - floor-new-wc
          - minimum
          - cross-new-wp-old-wc
          - legacy-php74
        storage: [legacy, hpos]
        include:
          - cell: current
            wordpress: '7.1'
            woocommerce: '11.1.0'
            php: '8.3'
          - cell: current-php85
            wordpress: '7.1'
            woocommerce: '11.1.0'
            php: '8.5'
          - cell: current-php84
            wordpress: '7.1'
            woocommerce: '11.1.0'
            php: '8.4'
          - cell: current-php82
            wordpress: '7.1'
            woocommerce: '11.1.0'
            php: '8.2'
          - cell: previous
            wordpress: '7.0.4'
            woocommerce: '11.0.1'
            php: '8.3'
          - cell: floor-old-wc
            wordpress: '7.0.4'
            woocommerce: '10.8.1'
            php: '8.3'
          - cell: floor-new-wc
            wordpress: '7.0.4'
            woocommerce: '11.1.0'
            php: '8.3'
          - cell: minimum
            wordpress: '6.9.7'
            woocommerce: '10.8.1'
            php: '8.3'
          - cell: cross-new-wp-old-wc
            wordpress: '7.1'
            woocommerce: '10.8.1'
            php: '8.3'
          - cell: legacy-php74
            wordpress: '6.9.7'
            woocommerce: '10.8.1'
            php: '7.4'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMPATIBILITY_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, mysqli, zip
          coverage: none
          tools: none

      - name: Install pinned WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 120 \
            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar \
            -o /tmp/wp-cli.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum -c -
          chmod +x /tmp/wp-cli.phar
          /tmp/wp-cli.phar --version

      - name: Install real WordPress and WooCommerce runtime
        env:
          WP_CLI_BIN: /tmp/wp-cli.phar
        run: >-
          bash scripts/install-wp-test-environment.sh
          "${{ matrix.wordpress }}"
          "${{ matrix.woocommerce }}"
          "$RUNNER_TEMP/wordpress"

      - name: Seed malformed protected settings
        env:
          SUPCHECKOUT_CERT_PHASE: seed
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/PluginActivationTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Activate SUPCheckout
        run: /tmp/wp-cli.phar plugin activate "$SUPCHECKOUT_PLUGIN_SLUG" --path="$RUNNER_TEMP/wordpress"

      - name: Verify activation and Classic registration
        env:
          SUPCHECKOUT_CERT_PHASE: verify
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/PluginActivationTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify release support metadata
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/ReleaseMetadataTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify Blocks registration and availability
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/CheckoutRegistrationTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify provider environment fail-safe
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/ProviderModeSafetyTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify order completion preference safety
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OrderCompletionPreferenceSafetyTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify gateway presentation checkbox safety
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/GatewayPresentationSafetyTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify fresh gateway default hydration safety
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/GatewayFreshDefaultsSafetyTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify frontend asset scope
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/FrontendAssetScopeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify repeated embedded render ownership
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/EmbeddedRenderOwnershipTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify real HTTP checkout request contexts
        env:
          WP_CLI_BIN: /tmp/wp-cli.phar
        run: bash tests/integration/checkout-request-context-http.sh "$RUNNER_TEMP/wordpress"

      - name: Select authoritative order store
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.storage }}" == "hpos" ]]; then
            /tmp/wp-cli.phar option update woocommerce_custom_orders_table_enabled yes --path="$RUNNER_TEMP/wordpress"
          else
            /tmp/wp-cli.phar option update woocommerce_custom_orders_table_enabled no --path="$RUNNER_TEMP/wordpress"
          fi
          /tmp/wp-cli.phar option update woocommerce_custom_orders_table_data_sync_enabled no --path="$RUNNER_TEMP/wordpress"
          /tmp/wp-cli.phar cache flush --path="$RUNNER_TEMP/wordpress"

      - name: Verify order CRUD in authoritative store
        env:
          SUPCHECKOUT_HPOS_MODE: ${{ matrix.storage }}
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/HposCompatibilityTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify finalized Woo order economics authority
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OrderEconomicsRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify checkout shipping finalization boundary
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/CheckoutValidationBoundaryRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify saved-card and tokenization runtime boundaries
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/SavedCardRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify subscription eligibility and pre-dispatch boundaries
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/SubscriptionRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify single additional-merchant allocation boundary
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/MultiMerchantRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Seed operations/data-retention certification
        env:
          SUPCHECKOUT_CERT_PHASE: seed
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OperationsRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Deactivate SUPCheckout without data loss
        run: /tmp/wp-cli.phar plugin deactivate "$SUPCHECKOUT_PLUGIN_SLUG" --path="$RUNNER_TEMP/wordpress"

      - name: Verify deactivation retention
        env:
          SUPCHECKOUT_CERT_PHASE: deactivated
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OperationsRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Reactivate SUPCheckout
        run: /tmp/wp-cli.phar plugin activate "$SUPCHECKOUT_PLUGIN_SLUG" --path="$RUNNER_TEMP/wordpress"

      - name: Verify reactivation retention
        env:
          SUPCHECKOUT_CERT_PHASE: reactivated
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OperationsRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Execute non-destructive uninstall contract without deleting files
        run: /tmp/wp-cli.phar plugin uninstall "$SUPCHECKOUT_PLUGIN_SLUG" --deactivate --skip-delete --path="$RUNNER_TEMP/wordpress"

      - name: Verify uninstall retention
        env:
          SUPCHECKOUT_CERT_PHASE: uninstalled
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OperationsRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Reactivate after uninstall contract probe
        run: /tmp/wp-cli.phar plugin activate "$SUPCHECKOUT_PLUGIN_SLUG" --path="$RUNNER_TEMP/wordpress"

      - name: Verify final retained state and clean certification fixtures
        env:
          SUPCHECKOUT_CERT_PHASE: final
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OperationsRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

  compatibility-gate:
    name: Compatibility Gate
    if: ${{ always() }}
    needs: [runtime-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all compatibility matrix cells
        env:
          RUNTIME_MATRIX_RESULT: ${{ needs.runtime-matrix.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNTIME_MATRIX_RESULT" = "success"
