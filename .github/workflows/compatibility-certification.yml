name: Compatibility Certification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPATIBILITY_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  SUPCHECKOUT_PLUGIN_SLUG: supcheckout

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-matrix:
    name: WP ${{ matrix.wordpress }} / WC ${{ matrix.woocommerce }} / PHP ${{ matrix.php }} / ${{ matrix.storage }}
    runs-on: ubuntu-latest
    # 0c Task 9 adds the REST/Action Scheduler steps, about 5 minutes per cell (the rollback
    # waits out its real 120 s settle barrier).
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        cell:
          - current
          - current-php85
          - current-php84
          - current-php82
          - previous
          - floor-old-wc
          - floor-new-wc
          - minimum
          - cross-new-wp-old-wc
          - legacy-php74
        storage: [legacy, hpos]
        include:
          - cell: current
            wordpress: '7.1.3'
            woocommerce: '11.1.2'
            php: '8.3'
          - cell: current-php85
            wordpress: '7.1.3'
            woocommerce: '11.1.2'
            php: '8.5'
          - cell: current-php84
            wordpress: '7.1.3'
            woocommerce: '11.1.2'
            php: '8.4'
          - cell: current-php82
            wordpress: '7.1.3'
            woocommerce: '11.1.2'
            php: '8.2'
          - cell: previous
            wordpress: '7.0.7'
            woocommerce: '11.0.1'
            php: '8.3'
          - cell: floor-old-wc
            wordpress: '7.0.7'
            woocommerce: '10.8.1'
            php: '8.3'
          - cell: floor-new-wc
            wordpress: '7.0.7'
            woocommerce: '11.1.2'
            php: '8.3'
          - cell: minimum
            wordpress: '6.9.10'
            woocommerce: '10.8.1'
            php: '8.3'
          - cell: cross-new-wp-old-wc
            wordpress: '7.1.3'
            woocommerce: '10.8.1'
            php: '8.3'
          - cell: legacy-php74
            wordpress: '6.9.10'
            woocommerce: '10.8.1'
            php: '7.4'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMPATIBILITY_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, mysqli, zip
          coverage: none
          tools: none

      - name: Install nginx + PHP-FPM for request-context HTTP gate
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          sudo apt-get install -y -qq "php${{ matrix.php }}-fpm" || true
          nginx -v

      - name: Install pinned WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 120 \
            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar \
            -o /tmp/wp-cli.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum -c -
          chmod +x /tmp/wp-cli.phar
          /tmp/wp-cli.phar --version

      - name: Install real WordPress and WooCommerce runtime
        env:
          WP_CLI_BIN: /tmp/wp-cli.phar
        run: >-
          bash scripts/install-wp-test-environment.sh
          "${{ matrix.wordpress }}"
          "${{ matrix.woocommerce }}"
          "$RUNNER_TEMP/wordpress"

      - name: Seed malformed protected settings
        env:
          SUPCHECKOUT_CERT_PHASE: seed
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/PluginActivationTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Activate SUPCheckout
        run: /tmp/wp-cli.phar plugin activate "$SUPCHECKOUT_PLUGIN_SLUG" --path="$RUNNER_TEMP/wordpress"

      - name: Verify activation and Classic registration
        env:
          SUPCHECKOUT_CERT_PHASE: verify
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/PluginActivationTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify release support metadata
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/ReleaseMetadataTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify Blocks registration and availability
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/CheckoutRegistrationTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify R2 callback portability
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/CallbackPortabilityRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify provider environment fail-safe
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/ProviderModeSafetyTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify order completion preference safety
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OrderCompletionPreferenceSafetyTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify gateway presentation checkbox safety
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/GatewayPresentationSafetyTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify one gateway instance (hooks registered once)
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/GatewaySingleInstanceTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify fresh gateway default hydration safety
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/GatewayFreshDefaultsSafetyTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify frontend asset scope
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/FrontendAssetScopeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify repeated embedded render ownership
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/EmbeddedRenderOwnershipTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify real HTTP checkout request contexts
        env:
          WP_CLI_BIN: /tmp/wp-cli.phar
        run: bash tests/integration/checkout-request-context-http.sh "$RUNNER_TEMP/wordpress"

      - name: Select authoritative order store
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.storage }}" == "hpos" ]]; then
            /tmp/wp-cli.phar option update woocommerce_custom_orders_table_enabled yes --path="$RUNNER_TEMP/wordpress"
          else
            /tmp/wp-cli.phar option update woocommerce_custom_orders_table_enabled no --path="$RUNNER_TEMP/wordpress"
          fi
          /tmp/wp-cli.phar option update woocommerce_custom_orders_table_data_sync_enabled no --path="$RUNNER_TEMP/wordpress"
          /tmp/wp-cli.phar cache flush --path="$RUNNER_TEMP/wordpress"

      - name: Verify order CRUD in authoritative store
        env:
          SUPCHECKOUT_HPOS_MODE: ${{ matrix.storage }}
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/HposCompatibilityTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify Action Scheduler cross-version runtime
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/ActionSchedulerCompatibilityRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify finalized Woo order economics authority
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OrderEconomicsRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify checkout shipping finalization boundary
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/CheckoutValidationBoundaryRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify saved-card and tokenization runtime boundaries
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/SavedCardRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify subscription eligibility and pre-dispatch boundaries
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/SubscriptionRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: R5 callback lifecycle runtime (real Woo)
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/CallbackLifecycleRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify single additional-merchant allocation boundary
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/MultiMerchantRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Seed operations/data-retention certification
        env:
          SUPCHECKOUT_CERT_PHASE: seed
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OperationsRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Deactivate SUPCheckout without data loss
        run: /tmp/wp-cli.phar plugin deactivate "$SUPCHECKOUT_PLUGIN_SLUG" --path="$RUNNER_TEMP/wordpress"

      - name: Verify deactivation retention
        env:
          SUPCHECKOUT_CERT_PHASE: deactivated
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OperationsRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Reactivate SUPCheckout
        run: /tmp/wp-cli.phar plugin activate "$SUPCHECKOUT_PLUGIN_SLUG" --path="$RUNNER_TEMP/wordpress"

      - name: Verify reactivation retention
        env:
          SUPCHECKOUT_CERT_PHASE: reactivated
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OperationsRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Execute non-destructive uninstall contract without deleting files
        run: /tmp/wp-cli.phar plugin uninstall "$SUPCHECKOUT_PLUGIN_SLUG" --deactivate --skip-delete --path="$RUNNER_TEMP/wordpress"

      - name: Verify uninstall retention
        env:
          SUPCHECKOUT_CERT_PHASE: uninstalled
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OperationsRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Reactivate after uninstall contract probe
        run: /tmp/wp-cli.phar plugin activate "$SUPCHECKOUT_PLUGIN_SLUG" --path="$RUNNER_TEMP/wordpress"

      - name: Verify final retained state and clean certification fixtures
        env:
          SUPCHECKOUT_CERT_PHASE: final
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OperationsRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      # Last: the staging sanitizer scrubs this disposable runtime.
      - name: Verify staging sanitizer on real WooCommerce storage
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/StagingSanitizerTest.php" --path="$RUNNER_TEMP/wordpress"

      # Sub-project 0b Task 9, after everything else because it switches the store: with an
      # official-plugin stand-in active (SUPCheckout paused), `wp supcheckout takeover`
      # runs preflight and run --yes --deactivate-official, then a fresh process verifies.
      - name: Install official-plugin stand-in and takeover HTTP fixture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wordpress/wp-content/plugins/upayments" "$RUNNER_TEMP/wordpress/wp-content/mu-plugins"
          cp tests/integration/fixtures/official-upayments-stub.php "$RUNNER_TEMP/wordpress/wp-content/plugins/upayments/UPayments.php"
          cp tests/integration/fixtures/takeover-http-mu-plugin.php "$RUNNER_TEMP/wordpress/wp-content/mu-plugins/supcheckout-takeover-http.php"
          /tmp/wp-cli.phar plugin activate upayments --path="$RUNNER_TEMP/wordpress"

      - name: Verify takeover CLI while paused, then run the switch
        env:
          SUPCHECKOUT_CERT_PHASE: paused
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/TakeoverCliTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify the switched store
        env:
          SUPCHECKOUT_CERT_PHASE: verify
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/TakeoverCliTest.php" --path="$RUNNER_TEMP/wordpress"

      # Sub-project 0b Task 10: roll the switched store back, reactivating the stand-in. The
      # stand-in is first replaced by the variant that declares the official plugin's global
      # symbols, so loading it into the booted rollback process would fatal.
      - name: Install the official-plugin stand-in that declares the official globals
        run: cp tests/integration/fixtures/official-upayments-stub-globals.php "$RUNNER_TEMP/wordpress/wp-content/plugins/upayments/UPayments.php"

      - name: Roll the switched store back
        env:
          SUPCHECKOUT_CERT_PHASE: rollback
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/TakeoverCliTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify the rolled-back store
        env:
          SUPCHECKOUT_CERT_PHASE: rolled_back
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/TakeoverCliTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Abort a verified copy, then roll back with a later edit (exit 8)
        env:
          SUPCHECKOUT_CERT_PHASE: second_cycle
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/TakeoverCliTest.php" --path="$RUNNER_TEMP/wordpress"

      # Sub-project 0c Task 9: the admin REST API (supcheckout/v1) and the Action Scheduler
      # onboarding driver on the same store (stand-in active, SUPCheckout paused, preflight_ok).
      # Response headers are checked over real HTTP (nginx + PHP-FPM, up only for those steps);
      # every other call runs in-process through rest_do_request(), and every Action Scheduler
      # tick in a fresh `wp action-scheduler run` process. No provider traffic: the takeover
      # HTTP mu-plugin answers both probes.
      - name: Verify REST response headers over real HTTP while paused
        env:
          WP_CLI_BIN: /tmp/wp-cli.phar
        run: bash tests/integration/takeover-rest-http.sh "$RUNNER_TEMP/wordpress"

      - name: REST preflight and switch through Action Scheduler while paused
        env:
          SUPCHECKOUT_CERT_PHASE: rest_paused
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/TakeoverRestTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: REST self-test, setup checks and finalize refusals on the switched store
        env:
          SUPCHECKOUT_CERT_PHASE: rest_switched
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/TakeoverRestTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify REST response headers over real HTTP on the switched store
        env:
          WP_CLI_BIN: /tmp/wp-cli.phar
        run: bash tests/integration/takeover-rest-http.sh "$RUNNER_TEMP/wordpress"

      - name: REST rollback through Action Scheduler (the settle is a scheduled resume)
        env:
          SUPCHECKOUT_CERT_PHASE: rest_rollback
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/TakeoverRestTest.php" --path="$RUNNER_TEMP/wordpress"

      # Sub-project 0b Task 11, last because it is irreversible: cut over a third time, then
      # finalize (refused before 30 days, a read-only dry run, then forced after review).
      - name: Cut over again and finalize
        env:
          SUPCHECKOUT_CERT_PHASE: finalize
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/TakeoverCliTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Verify the finalized store
        env:
          SUPCHECKOUT_CERT_PHASE: finalized
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/TakeoverCliTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: REST finalize sweep on the finalized store
        env:
          SUPCHECKOUT_CERT_PHASE: rest_sweep
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/TakeoverRestTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Remove takeover fixtures
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/wordpress/wp-content/mu-plugins/supcheckout-takeover-http.php"
          rm -f "$RUNNER_TEMP/wordpress/wp-content/mu-plugins/supcheckout-takeover-rest-http.php"
          rm -rf "$RUNNER_TEMP/wordpress/wp-content/plugins/upayments"

  compatibility-gate:
    name: Compatibility Gate
    if: ${{ always() }}
    needs: [runtime-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all compatibility matrix cells
        env:
          RUNTIME_MATRIX_RESULT: ${{ needs.runtime-matrix.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNTIME_MATRIX_RESULT" = "success"
