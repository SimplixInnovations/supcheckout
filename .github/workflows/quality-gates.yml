name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  QUALITY_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALITY_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Required control files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md README.md CHANGELOG.md LICENSE NOTICE.md SECURITY.md SUPPORT.md
            .distignore .github/CODEOWNERS
            composer.json composer.lock phpcs.xml.dist phpstan.neon.dist phpunit.xml.dist
            .github/workflows/quality-gates.yml
            .github/workflows/compatibility-certification.yml
            .github/workflows/provider-sandbox-certification.yml
            .github/workflows/release-artifact.yml
            .github/workflows/wordpress-org-submission-check.yml
            scripts/build-release.sh scripts/verify-release.sh scripts/install-wp-test-environment.sh
            tests/harness/release-artifact-harness.php
            tests/harness/wordpress-org-submission-harness.php
            tests/harness/supcheckout-identity-migration-harness.php
            tests/harness/supcheckout-namespace-migration-harness.php
            tests/harness/supcheckout-frontend-identity-harness.php
            tests/harness/supcheckout-residue-harness.php
            tests/harness/wordpress-org-runtime-harness.php
            tests/harness/supcheckout-http-transport-harness.php
            tests/harness/supcheckout-provenance-db-failure-harness.php
            tests/harness/ecosystem-callback-cache-harness.php
            tests/harness/ecosystem-subscription-safety-harness.php
            tests/harness/ecosystem-subscription-lifecycle-matrix-harness.php
            tests/provider/sandbox-charge-smoke.php
            tests/integration/bootstrap.php
            tests/integration/PluginActivationTest.php
            tests/integration/CheckoutRegistrationTest.php
            tests/integration/HposCompatibilityTest.php
            tests/integration/ReleaseMetadataTest.php
            tests/integration/SavedCardRuntimeTest.php
            tests/integration/SubscriptionRuntimeTest.php
            tests/integration/MultiMerchantRuntimeTest.php
            tests/integration/OperationsRuntimeTest.php
            tests/integration/UpgradeCompatibilityTest.php
            tests/integration/CallbackPortabilityRuntimeTest.php
            docs/COMPATIBILITY.md docs/ENGINEERING-ROADMAP.md
            docs/history/H12-ENGINEERING-CHANGELOG.md
            docs/project/PROJECT-STATUS.md
            docs/project/OWNER-HANDOFF.md
            docs/project/ENTERPRISE-CERTIFICATION.md
            docs/project/RELEASE-ENGINEERING.md
            docs/project/NEW-CHAT-HANDOFF.md
            docs/project/NAMING-IDENTITY-STANDARD.md
            docs/project/PHASE-0-RELEASE-IDENTITY.md
            docs/project/PHASE-9I-MIGRATION.md
            docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
            docs/project/SECURITY-THREAT-MODEL.md
            docs/project/ARCHITECTURE-CODE-QUALITY.md
            docs/project/QUALITY-PLATFORM.md
            docs/project/BASELINE-H12.md
            docs/project/REPOSITORY-AUDIT.md
            docs/project/REPOSITORY-READINESS.md
            docs/superpowers/specs/2026-09-06-sucheckout-upayments-identity-migration-design.md
            docs/superpowers/plans/2026-09-06-sucheckout-upayments-identity-migration.md
            docs/superpowers/specs/2026-09-07-supcheckout-provider-specific-identity-design.md
            docs/superpowers/plans/2026-09-07-supcheckout-final-provider-identity.md
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "Missing or empty required control file: $path"; exit 1; }
          done

      - name: Current SUPCheckout living-state invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<h1 align="center">SUPCheckout for UPayments</h1>' README.md
          grep -Fq '| Technical slug / text domain | `supcheckout` |' docs/project/PROJECT-STATUS.md
          grep -Fq '| PHP namespace | `Simplixi\SUPCheckout` |' docs/project/PROJECT-STATUS.md
          grep -Fq '**Canonical GitHub repository:** `SimplixInnovations/supcheckout`' docs/project/OWNER-HANDOFF.md
          grep -Fq '`supcheckout/UPayments.php`' docs/project/PROJECT-STATUS.md
          grep -Fq 'No Q20 is justified.' docs/project/PROJECT-STATUS.md
          grep -Fq '**Canonical slug:** `supcheckout`' docs/project/NAMING-IDENTITY-STANDARD.md
          grep -Fq '=== SUPCheckout for UPayments ===' readme.txt
          grep -Fq 'Text Domain: supcheckout' UPayments.php
          grep -Fq 'SLUG="supcheckout"' scripts/build-release.sh
          grep -Fq 'slug = "supcheckout"' scripts/verify-release.sh
          grep -Fq 'slug: supcheckout' .github/workflows/wordpress-org-submission-check.yml
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/PHASE-0-RELEASE-IDENTITY.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/PHASE-9I-MIGRATION.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/SECURITY-THREAT-MODEL.md
          grep -Fq '**Status:** DONE / VERIFIED (DISCOVERY + A1-A5)' docs/project/ARCHITECTURE-CODE-QUALITY.md
          grep -Fq '**Status:** DONE / VERIFIED (Q1-Q19)' docs/project/QUALITY-PLATFORM.md

      - name: Reject stale current-gate ownership in living records
        shell: bash
        run: |
          set -euo pipefail
          living=(
            AGENTS.md README.md CHANGELOG.md docs/ENGINEERING-ROADMAP.md docs/COMPATIBILITY.md
            docs/project/PROJECT-STATUS.md docs/project/OWNER-HANDOFF.md docs/project/ENTERPRISE-CERTIFICATION.md
            docs/project/RELEASE-ENGINEERING.md docs/project/NEW-CHAT-HANDOFF.md
          )

          reject_across_live_records() {
            local marker="$1"
            if grep -FnH -F -- "$marker" "${living[@]}"; then
              echo "Stale current-gate marker in living record: $marker"
              exit 1
            fi
          }

          reject_across_live_records 'Enterprise Compatibility Certification — CURRENT GATE'
          reject_across_live_records 'Full Automated Quality Platform — CURRENT GATE'
          reject_across_live_records 'Security Threat-Model Closure — CURRENT GATE'
          reject_across_live_records 'Architecture & Code-Quality Foundation — CURRENT GATE'
          reject_across_live_records 'Enterprise Release Candidate Closeout — CURRENT / FINAL VERIFICATION'
          reject_across_live_records 'TASK 8 RELEASE-CANDIDATE CLOSEOUT CURRENT'
          reject_across_live_records 'CURRENT / Q1**'
          reject_across_live_records 'CURRENT / Q2'
          reject_across_live_records 'CURRENT / Q3'
          reject_across_live_records 'CURRENT / Q4'
          reject_across_live_records 'CURRENT / Q5'
          reject_across_live_records 'CURRENT / Q6'
          reject_across_live_records 'CURRENT / Q7'
          reject_across_live_records 'CURRENT / Q8'
          reject_across_live_records 'CURRENT / Q9'
          reject_across_live_records 'CURRENT / Q10'
          reject_across_live_records 'CURRENT / Q11'
          reject_across_live_records 'CURRENT / Q12'
          reject_across_live_records 'CURRENT / Q13'
          reject_across_live_records 'CURRENT / Q14'
          reject_across_live_records 'CURRENT / Q15'
          reject_across_live_records 'CURRENT / Q16'
          reject_across_live_records 'CURRENT / Q17'
          reject_across_live_records 'CURRENT / Q18'
          reject_across_live_records 'CURRENT / Q19'

      - name: Reject retired first-party identity in canonical release controls
        shell: bash
        run: |
          set -euo pipefail
          if grep -FnH -e 'simplixpay-upayments-*.zip' -e 'sucheckout-upayments-*.zip' \
            scripts/build-release.sh scripts/verify-release.sh \
            .github/workflows/wordpress-org-submission-check.yml; then
            echo 'Retired first-party release ZIP identity detected.'
            exit 1
          fi
          if grep -FnH -e 'Text Domain: upayments' -e 'Text Domain: sucheckout-upayments' UPayments.php readme.txt; then
            echo 'Retired first-party text domain detected in canonical metadata.'
            exit 1
          fi

      - name: Whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi

  quality-platform:
    name: Quality Platform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALITY_SOURCE_SHA }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:2.10.3
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install locked development toolchain
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Unit and static quality gates
        run: composer quality

  php-syntax-compatibility:
    name: PHP ${{ matrix.php }} syntax (not certification)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '8.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALITY_SOURCE_SHA }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Distributed PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.php' ':(exclude)tests/**' | xargs -0 -r -n1 php -l

  h12-regression:
    name: H12 Regression Harness
    needs:
      - quality-platform
      - php-syntax-compatibility
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require upstream quality prerequisites
        shell: bash
        env:
          QUALITY_PLATFORM_RESULT: ${{ needs.quality-platform.result }}
          PHP_SYNTAX_RESULT: ${{ needs.php-syntax-compatibility.result }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_PLATFORM_RESULT" != success || "$PHP_SYNTAX_RESULT" != success ]]; then
            echo "Required quality prerequisite failed: quality-platform=$QUALITY_PLATFORM_RESULT php-syntax=$PHP_SYNTAX_RESULT"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALITY_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: zip
          coverage: none
          tools: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Tracked PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -r -n1 php -l

      - name: Permanent PHP regression harnesses
        shell: bash
        run: |
          set -euo pipefail
          harnesses=(
            tests/harness/supcheckout-identity-migration-harness.php
            tests/harness/supcheckout-namespace-migration-harness.php
            tests/harness/supcheckout-frontend-identity-harness.php
            tests/harness/supcheckout-residue-harness.php
            tests/harness/wordpress-org-runtime-harness.php
            tests/harness/supcheckout-http-transport-harness.php
            tests/harness/supcheckout-provenance-db-failure-harness.php
            tests/harness/phase-0-release-identity-harness.php
            tests/harness/phase-9i-preflight-harness.php
            tests/harness/phase-9i-executor-harness.php
            tests/harness/phase-9i-operations-harness.php
            tests/harness/provider-payment-lifecycle-harness.php
            tests/harness/provider-payment-amount-binding-harness.php
            tests/harness/security-threat-model-harness.php
            tests/harness/architecture-foundation-harness.php
            tests/harness/architecture-runtime-bindings-harness.php
            tests/harness/architecture-bootstrap-path-harness.php
            tests/harness/architecture-provider-endpoints-harness.php
            tests/harness/architecture-payment-method-availability-harness.php
            tests/harness/architecture-gateway-settings-harness.php
            tests/harness/architecture-subscription-presentation-harness.php
            tests/harness/architecture-checkout-orchestration-harness.php
            tests/harness/architecture-dependency-boundaries-harness.php
            tests/harness/architecture-active-callback-characterization-harness.php
            tests/harness/architecture-legacy-callback-routing-harness.php
            tests/harness/architecture-legacy-direct-callback-characterization-harness.php
            tests/harness/ecosystem-callback-cache-harness.php
            tests/harness/ecosystem-subscription-safety-harness.php
            tests/harness/ecosystem-subscription-lifecycle-matrix-harness.php
            tests/harness/quality-platform-foundation-harness.php
            tests/harness/quality-platform-static-analysis-harness.php
            tests/harness/quality-platform-payment-concurrency-harness.php
            tests/harness/quality-platform-authenticated-status-harness.php
            tests/harness/quality-platform-payment-method-availability-harness.php
            tests/harness/quality-platform-gateway-settings-harness.php
            tests/harness/quality-platform-public-order-status-harness.php
            tests/harness/quality-platform-release-identity-harness.php
            tests/harness/quality-platform-migration-settings-harness.php
            tests/harness/quality-platform-migration-bootstrap-harness.php
            tests/harness/quality-platform-subscription-composition-harness.php
            tests/harness/quality-platform-subscription-product-type-harness.php
            tests/harness/quality-platform-migration-cli-harness.php
            tests/harness/quality-platform-migration-admin-harness.php
            tests/harness/quality-platform-subscription-presentation-harness.php
            tests/harness/quality-platform-migration-core-harness.php
            tests/harness/quality-platform-payment-runtime-harness.php
            tests/harness/quality-platform-blocks-availability-harness.php
            tests/harness/quality-platform-subscription-product-eligibility-harness.php
            tests/harness/release-artifact-harness.php
            tests/harness/wordpress-org-submission-harness.php
            tests/harness/phase-9g-h12-php-harness.php
          )
          failures=0
          for harness in "${harnesses[@]}"; do
            echo "==> $harness"
            if output="$(php -d error_reporting=E_ALL -d display_errors=1 "$harness" 2>&1)"; then
              status=0
            else
              status=$?
            fi
            printf '%s\n' "$output"
            if [[ "$status" -ne 0 ]]; then
              failures=$((failures + 1))
              continue
            fi
            if grep -Eq '^(PHP )?(Deprecated|Warning|Notice):' <<<"$output"; then
              echo "Permanent PHP regression harness emitted a PHP issue: $harness"
              failures=$((failures + 1))
            fi
          done
          if [[ "$failures" -ne 0 ]]; then
            echo "Permanent PHP regression harness failures/issues: $failures"
            exit 1
          fi

      - name: Blocks harness syntax
        run: node --check tests/harness/phase-9g-h12-blocks-harness.js

      - name: H12 Blocks harness
        run: node tests/harness/phase-9g-h12-blocks-harness.js
