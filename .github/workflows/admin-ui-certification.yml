name: Admin UI Certification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Regenerate the visual baselines and upload them for review (the gate then fails until they are committed)
        type: boolean
        default: false

permissions:
  contents: read

env:
  ADMIN_UI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: admin-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static — lint, types, unit, build contract, drift (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ADMIN_UI_SOURCE_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Require exact-head checkout and pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMIN_UI_SOURCE_SHA"
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(npm --version)" = "$(node -p 'require("./package.json").engines.npm')"
          echo "ADMIN UI SOURCE: $(git rev-parse HEAD) node $(node --version) npm $(npm --version)"

      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts

      - name: Locked dependency audit (bundled dependencies, every severity)
        run: npm audit --omit=dev

      - name: Locked dependency audit (full tree, high and critical)
        run: npm run audit:full

      - name: Toolchain engines
        run: npx wp-scripts check-engines

      - name: Lint, typecheck, unit and build-contract tests, build and drift
        run: npm run quality

      - name: Component tests on React 19 (forward compatibility)
        run: npm run test:unit:react19

      - name: Second clean build is byte-identical
        run: rm -rf assets/admin/build node_modules/.cache && npm run build && npm run check:drift

  build-windows:
    name: Build and drift (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # npm runs package scripts through cmd.exe on Windows; check:drift is a
      # POSIX command, so point npm at Git Bash (not the WSL bash on PATH).
      npm_config_script_shell: 'C:\Program Files\Git\bin\bash.exe'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ADMIN_UI_SOURCE_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Require exact-head checkout and pinned toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMIN_UI_SOURCE_SHA"
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(npm --version)" = "$(node -p 'require("./package.json").engines.npm')"

      - name: Clean install, build and drift
        run: npm ci --ignore-scripts && npm run build && npm run check:drift

      - name: Committed build has LF line endings in the Windows working tree
        run: |
          set -euo pipefail
          git ls-files --eol -- assets/admin/build
          if git ls-files --eol -- assets/admin/build | grep -E 'w/(crlf|mixed)'; then
            echo "CRLF or mixed line endings found in the Windows working-tree build"
            exit 1
          fi

  browser:
    name: Browser — WordPress ${{ matrix.wordpress }} / WooCommerce ${{ matrix.woocommerce }} (real wp-admin)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.9.10'
            woocommerce: '10.8.1'
          - wordpress: '7.1.3'
            woocommerce: '11.1.2'
    env:
      WP_CLI_BIN: /tmp/wp-cli.phar
      # Test-only credentials for a throwaway site on 127.0.0.1. cert-admin comes
      # from scripts/install-wp-test-environment.sh; sup-ar is created below.
      SUP_UI_BASE_URL: http://127.0.0.1:8080
      SUP_UI_ADMIN_USER: cert-admin
      SUP_UI_ADMIN_PASSWORD: cert-password-not-production
      SUP_UI_AR_USER: sup-ar
      SUP_UI_AR_PASSWORD: sup-ar-password-not-production
      SUP_UI_WP_VERSION: ${{ matrix.wordpress }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ADMIN_UI_SOURCE_SHA }}
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          extensions: curl, mbstring, mysqli, zip, intl
          coverage: none
          tools: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Require exact-head checkout and pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMIN_UI_SOURCE_SHA"
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(npm --version)" = "$(node -p 'require("./package.json").engines.npm')"
          echo "ADMIN UI SOURCE: $(git rev-parse HEAD) node $(node --version) npm $(npm --version) php $(php -r 'echo PHP_VERSION;')"

      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts

      - name: Install pinned WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 120 \
            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar \
            -o /tmp/wp-cli.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum -c -
          chmod +x /tmp/wp-cli.phar
          /tmp/wp-cli.phar --version

      - name: Install real WordPress ${{ matrix.wordpress }} and WooCommerce ${{ matrix.woocommerce }}
        shell: bash
        env:
          SUPCHECKOUT_DB_NAME: wordpress
          SUPCHECKOUT_DB_USER: root
          SUPCHECKOUT_DB_PASSWORD: root
          SUPCHECKOUT_DB_HOST: 127.0.0.1:3306
        run: |
          set -euo pipefail
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS wordpress;"
          bash scripts/install-wp-test-environment.sh "${{ matrix.wordpress }}" "${{ matrix.woocommerce }}" "$RUNNER_TEMP/wordpress"
          /tmp/wp-cli.phar plugin activate supcheckout --path="$RUNNER_TEMP/wordpress"
          /tmp/wp-cli.phar option update woocommerce_coming_soon no --path="$RUNNER_TEMP/wordpress"

      - name: Install the test-only gallery mu-plugin, Arabic user and fixture translations
        shell: bash
        run: |
          set -euo pipefail
          WP="$RUNNER_TEMP/wordpress"
          mkdir -p "$WP/wp-content/mu-plugins"
          cp tests/admin-ui/wp/supcheckout-ui-gallery.php "$WP/wp-content/mu-plugins/"
          /tmp/wp-cli.phar config set SUPCHECKOUT_UI_GALLERY true --raw --type=constant --path="$WP"
          /tmp/wp-cli.phar user create "$SUP_UI_AR_USER" sup-ar@example.test --role=administrator \
            --user_pass="$SUP_UI_AR_PASSWORD" --porcelain --path="$WP"
          /tmp/wp-cli.phar user meta update "$SUP_UI_AR_USER" locale ar --path="$WP"
          php tests/admin-ui/wp/make-fixture-translations.php "$WP"

      - name: Built strings are extractable for the supcheckout domain
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp-cli.phar i18n make-pot . "$RUNNER_TEMP/sup.pot" --include=assets/admin/build --domain=supcheckout
          grep -q 'msgid "SUPCheckout"' "$RUNNER_TEMP/sup.pot"

      - name: Build the test-only gallery
        run: npm run build:gallery

      - name: Install the Playwright-pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the browser suite in four modes
        shell: bash
        env:
          PHP_CLI_SERVER_WORKERS: '4'
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t "$RUNNER_TEMP/wordpress" >"$RUNNER_TEMP/php-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "$SUP_UI_BASE_URL/wp-login.php"; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            echo "PHP server did not become ready"
            cat "$RUNNER_TEMP/php-server.log"
            exit 70
          fi
          npm run test:browser

      - name: Upload screenshots, traces and server log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-browser-wp-${{ matrix.wordpress }}
          path: |
            tests/admin-ui/artifacts/test-results
            tests/admin-ui/artifacts/report
            ${{ runner.temp }}/php-server.log
          if-no-files-found: ignore
          retention-days: 14

  visual:
    name: Visual regression — WordPress 7.1.3 / WooCommerce 11.1.2 (Linux baselines)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WP_CLI_BIN: /tmp/wp-cli.phar
      # Test-only credentials for a throwaway site on 127.0.0.1. cert-admin comes
      # from scripts/install-wp-test-environment.sh; sup-ar is created below.
      SUP_UI_BASE_URL: http://127.0.0.1:8080
      SUP_UI_ADMIN_USER: cert-admin
      SUP_UI_ADMIN_PASSWORD: cert-password-not-production
      SUP_UI_AR_USER: sup-ar
      SUP_UI_AR_PASSWORD: sup-ar-password-not-production
      SUP_UI_WP_VERSION: '7.1.3'
      SUP_UI_WC_VERSION: '11.1.2'
      UPDATE_VISUAL_BASELINES: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ADMIN_UI_SOURCE_SHA }}
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          extensions: curl, mbstring, mysqli, zip, intl
          coverage: none
          tools: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Require exact-head checkout and pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMIN_UI_SOURCE_SHA"
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(npm --version)" = "$(node -p 'require("./package.json").engines.npm')"
          echo "ADMIN UI SOURCE: $(git rev-parse HEAD) node $(node --version) npm $(npm --version) php $(php -r 'echo PHP_VERSION;') update-baselines $UPDATE_VISUAL_BASELINES"

      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts

      - name: Install pinned WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 120 \
            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar \
            -o /tmp/wp-cli.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum -c -
          chmod +x /tmp/wp-cli.phar
          /tmp/wp-cli.phar --version

      - name: Install real WordPress 7.1.3 and WooCommerce 11.1.2
        shell: bash
        env:
          SUPCHECKOUT_DB_NAME: wordpress
          SUPCHECKOUT_DB_USER: root
          SUPCHECKOUT_DB_PASSWORD: root
          SUPCHECKOUT_DB_HOST: 127.0.0.1:3306
        run: |
          set -euo pipefail
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS wordpress;"
          bash scripts/install-wp-test-environment.sh "$SUP_UI_WP_VERSION" "$SUP_UI_WC_VERSION" "$RUNNER_TEMP/wordpress"
          /tmp/wp-cli.phar plugin activate supcheckout --path="$RUNNER_TEMP/wordpress"
          /tmp/wp-cli.phar option update woocommerce_coming_soon no --path="$RUNNER_TEMP/wordpress"

      - name: Install the test-only gallery mu-plugin and Arabic user
        shell: bash
        run: |
          set -euo pipefail
          WP="$RUNNER_TEMP/wordpress"
          mkdir -p "$WP/wp-content/mu-plugins"
          cp tests/admin-ui/wp/supcheckout-ui-gallery.php "$WP/wp-content/mu-plugins/"
          /tmp/wp-cli.phar config set SUPCHECKOUT_UI_GALLERY true --raw --type=constant --path="$WP"
          /tmp/wp-cli.phar user create "$SUP_UI_AR_USER" sup-ar@example.test --role=administrator \
            --user_pass="$SUP_UI_AR_PASSWORD" --porcelain --path="$WP"
          /tmp/wp-cli.phar user meta update "$SUP_UI_AR_USER" locale ar --path="$WP"

      - name: Build the gallery with the test-only brand file and vendored fonts
        env:
          SUP_BRAND: tests/admin-ui/gallery/vr-brand.tokens.json
        run: npm run build:gallery

      - name: Fonts and branded tokens stay in the gallery build, never in assets/
        shell: bash
        run: |
          set -euo pipefail
          test "$(find tests/admin-ui/gallery/build/fonts -name '*.woff2' | wc -l)" = 5
          test -f tests/admin-ui/gallery/build/brand/tokens.generated.css
          npm run check:drift
          if git ls-files -- assets | grep -Ei '\.(woff2?|ttf|otf|eot)$'; then
            echo "A font file is tracked under assets/"
            exit 1
          fi

      - name: Install the Playwright-pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the visual suite in four modes
        shell: bash
        env:
          PHP_CLI_SERVER_WORKERS: '4'
        run: |
          set -euo pipefail
          if [[ "$UPDATE_VISUAL_BASELINES" == true ]]; then
            export SUP_UPDATE_BASELINES=1
            rm -rf tests/admin-ui/visual/baselines
          fi
          php -S 127.0.0.1:8080 -t "$RUNNER_TEMP/wordpress" >"$RUNNER_TEMP/php-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "$SUP_UI_BASE_URL/wp-login.php"; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            echo "PHP server did not become ready"
            cat "$RUNNER_TEMP/php-server.log"
            exit 70
          fi
          npm run test:visual

      - name: Upload the regenerated baselines for review
        if: ${{ env.UPDATE_VISUAL_BASELINES == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-visual-baselines
          path: tests/admin-ui/visual/baselines
          if-no-files-found: error
          retention-days: 14

      - name: Upload diffs, traces and server log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-visual-diffs
          path: |
            tests/admin-ui/artifacts/test-results
            tests/admin-ui/artifacts/report
            ${{ runner.temp }}/php-server.log
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: Admin UI Gate
    needs:
      - static
      - build-windows
      - browser
      - visual
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every admin UI lane to succeed
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          BUILD_WINDOWS_RESULT: ${{ needs.build-windows.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
          UPDATE_VISUAL_BASELINES: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines && 'true' || 'false' }}
        run: |
          set -euo pipefail
          echo "static=$STATIC_RESULT build-windows=$BUILD_WINDOWS_RESULT browser=$BROWSER_RESULT visual=$VISUAL_RESULT update-baselines=$UPDATE_VISUAL_BASELINES"
          failed=0
          # A baseline update can never be green on its own; say so even when a lane failed too.
          if [[ "$UPDATE_VISUAL_BASELINES" != false ]]; then
            echo "baselines regenerated; commit them and rerun"
            failed=1
          fi
          if [[ "$STATIC_RESULT" != success || "$BUILD_WINDOWS_RESULT" != success || "$BROWSER_RESULT" != success || "$VISUAL_RESULT" != success ]]; then
            echo "Admin UI certification failed: skipped or cancelled counts as failure."
            failed=1
          fi
          exit "$failed"
