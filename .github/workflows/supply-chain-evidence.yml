name: Supply Chain Evidence

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Runtime + development SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build artifact zip
        run: bash scripts/build-release.sh /tmp/sbom-artifact
      - name: Set SOURCE_DATE_EPOCH from exact commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV
      - name: Generate SBOM + license inventory
        run: |
          set -euo pipefail
          mkdir -p evidence/sbom
          python3 scripts/generate-sbom-evidence.py evidence/sbom /tmp/sbom-artifact/supcheckout-0.1.0.zip | tee evidence/sbom/summary.txt
          python3 scripts/validate-sbom-evidence.py evidence/sbom
      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence
          path: evidence/sbom/
