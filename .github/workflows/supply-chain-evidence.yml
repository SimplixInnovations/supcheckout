name: Supply Chain Evidence

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Runtime + development SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build artifact zip
        run: bash scripts/build-release.sh /tmp/sbom-artifact
      - name: Generate SBOM + license inventory
        run: |
          set -euo pipefail
          python3 scripts/generate-sbom-evidence.py evidence/sbom /tmp/sbom-artifact/supcheckout-0.1.0.zip | tee evidence/sbom/summary.txt
          # structural validation already fails empty/malformed SBOM
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          for name, minc in (("runtime-sbom.cdx.json", 50), ("dev-sbom.cdx.json", 1)):
              p=Path("evidence/sbom")/name
              o=json.loads(p.read_text())
              assert o["bomFormat"]=="CycloneDX"
              assert len(o["components"])>=minc
              print(f"VALIDATED {name} components={len(o['components'])}")
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence
          path: evidence/sbom/
