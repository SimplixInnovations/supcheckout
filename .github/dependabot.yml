version: 2
# Review routing comes from .github/CODEOWNERS (the `reviewers` key is
# deprecated), so no ecosystem names reviewers here.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dubai
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Dubai
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      php-quality-tooling:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Dubai
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
    ignore:
      # WordPress provides React 18.3.1 at runtime (externals), so the dev copy
      # must match it. React 19 is covered by the test:unit:react19 lane.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # The typescript-eslint pinned by @wordpress/scripts supports TypeScript
      # below 6.1.0 only; move TypeScript with the wp-scripts toolchain.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Node.js types follow the pinned Node 24 runtime (.nvmrc), not the
      # newest Node release line.
      - dependency-name: "@types/node"
        versions: [">= 25"]
    groups:
      admin-ui-runtime:
        dependency-type: production
        patterns:
          - "*"
      admin-ui-tooling:
        dependency-type: development
        patterns:
          - "*"
