version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dubai
    open-pull-requests-limit: 3
    reviewers:
      - SimplixInnovationsAdmin
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Dubai
    open-pull-requests-limit: 3
    reviewers:
      - SimplixInnovationsAdmin
    versioning-strategy: increase
    groups:
      php-quality-tooling:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Dubai
    open-pull-requests-limit: 3
    reviewers:
      - SimplixInnovationsAdmin
    cooldown:
      default-days: 14
    groups:
      admin-ui-runtime:
        dependency-type: production
        patterns:
          - "*"
      admin-ui-tooling:
        dependency-type: development
        patterns:
          - "*"
