version: 2
project:
  name: SUPCheckout for UPayments
  repository: SimplixInnovations/supcheckout
  provider_scope: UPayments-only
  php_namespace: 'Simplixi\SUPCheckout'
  runtime_floor: PHP >= 7.4

decision:
  style: incremental strangler modernization
  variant: around proven A1-A5 seams and the existing PaymentLifecycle callback strangler
  adr: .ai-architect/decisions/ADR-001-approach-3-strangler-modernization.md

baselines:
  live_main_at_decision: 0b153c661314669924c81e89fd71bfd2c734310b
  frozen_accepted_approach_2_sha: 0c883d609906676966002eb022a82a9656eeacc5
  accepted_package_sha256: 58eba75019416f39a09211c87e7ccbcbb635834fb20bc890e9efbd5fec859655
  accepted_package_files: 51
  latest_merged_approach_3_main: a7a8bbfc3a1dc551127b7ead897c964e95c7cec9
  latest_runtime_bearing_merged_main: 047cc86060efb97761d7a0cc4a3806f971ab6fe1

boundaries:
  platform_edges:
    - UPayments.php bootstrap and WC_Upayments compatibility gateway
    - PaymentLifecycle::handle_callback active wc_upayments callback at priority 5
    - WCGatewayUPaymentsBlocks compatibility-located Blocks adapter
    - PublicOrderStatus
  application_payment:
    - CheckoutOrchestrator
    - CheckoutPayload
    - PaymentLifecycle
    - StatusVerifier
    - SavedCardSelection
    - SavedCardPresentation
    - OrderLock
    - StatusRateGate
  provider_infrastructure:
    - EndpointResolver
    - PaymentMethodAvailability
    - WC_Upayments::execute_upayments_request
    - StatusVerifier::verify
    - protected Scheduler renewal transport

dependency_rules:
  - rule: allow
    from: UPayments.php/WC_Upayments
    to: src/*
    reason: WooCommerce compatibility adapter may delegate inward.
  - rule: allow
    from: PaymentLifecycle
    to: StatusVerifier, OrderLock, ProviderResult, PublicOrderStatus and explicit WooCommerce order APIs
    reason: Canonical callback/reconciliation lifecycle.
  - rule: deny
    from: inward payment/provider services
    to: new service discovery or reverse lookup through WC_Upayments/WooCommerce registries beyond characterized exceptions
    reason: No new service-locator or reverse gateway dependency.
  - rule: deny
    from: src/Payment/*
    to: new ambient request superglobal parsing beyond characterized exceptions
    reason: Platform request parsing is an edge concern; accepted exceptions are non-growing.
  - rule: deny
    from: production code
    to: new provider HTTP egress site
    reason: T1 freezes the accepted egress inventory.
  - rule: deny
    from: Approach 3
    to: generic multi-provider interfaces/frameworks
    reason: Repository is permanently UPayments-specific.

identity_contracts:
  product_name: SUPCheckout for UPayments
  slug: supcheckout
  plugin_folder: supcheckout/
  first_stable_bootstrap: UPayments.php
  first_stable_basename: supcheckout/UPayments.php
  text_domain: supcheckout
  composer_package: simplix-innovations/supcheckout
  php_namespace_root: 'Simplixi\SUPCheckout'
  global_php_prefix: supcheckout_
  constants_prefix: 'SUPCHECKOUT_*'
  css_component_root: .supcheckout
  css_custom_properties: '--supcheckout-*'
  js_namespace: supCheckout
  localized_js_config: supCheckoutConfig
  rest_namespace: supcheckout/v1
  action_scheduler_group: supcheckout
  logger_source: supcheckout
  release_zip_pattern: supcheckout-X.Y.Z.zip

protected_contracts:
  - UPayments.php physical bootstrap
  - WC_Upayments class identity
  - WCGatewayUPaymentsBlocks class identity
  - upayments gateway/payment/Blocks identity
  - woocommerce_upayments_settings
  - wc_upayments
  - _upay_* historical metadata
  - UPayments_order_id and related provider-order identities
  - upayments_token_identity_secret_v2 and H12 provenance/scope/generation identities
  - upay_process_subscriptions
  - upay_hourly_cron_job historical cleanup identity
  - '{$wpdb->prefix}upayments_billing_attempts'
  - historical order payment-method identity
  - frozen Phase 9I migration identities
  - provider API field/path/schema terminology
  - getAPIUrlForRetreiveCards()
  - whitelabled normalized compatibility field
  - CustomerTokenIdentity.php protected blob
  - Scheduler.php and CycleClaim.php protected subscription blobs

forbidden_architecture:
  - ServiceRegistry or service locator
  - heavyweight DI container
  - generic PaymentProviderInterface solely for hypothetical future providers
  - big-bang rewrite
  - new parallel ReturnController/WebhookController architecture beside PaymentLifecycle
  - protected identity migration without a separate approved contract

provider_http_egress_baseline:
  - path: UPayments.php
    owner: WC_Upayments::execute_upayments_request
    primitive: wp_remote_request
  - path: src/Payment/StatusVerifier.php
    owner: StatusVerifier::verify
    primitive: wp_remote_get
  - path: includes/Subscription/Cron/Scheduler.php
    owner: Scheduler renewal dispatch
    primitive: wp_remote_request

tranches:
  t01:
    name: architecture-guardrails-and-active-callback-characterization
    status: done_verified
    merged_main_sha: beb89ac0c4d8c0e9b7c8b2de1e13c237bbd37b15
    pull_request: 102
    runtime_change: false
  t02:
    name: legacy-callback-routing-consolidation
    status: done_verified
    merged_main_sha: 047cc86060efb97761d7a0cc4a3806f971ab6fe1
    pull_request: 104
    runtime_change: true
    candidate_package_sha256: 368aaa5cb1a75e6df41ff17bb2e2126431b49da5e6b8dfe508c718433009fc04
    candidate_package_files: 51
  t03:
    name: legacy-direct-callback-characterization
    status: done_verified
    certified_head_sha: f7c7d596dc4a2c8464d1acdf13dfe51028a5f9e0
    merged_main_sha: a7a8bbfc3a1dc551127b7ead897c964e95c7cec9
    pull_request: 107
    runtime_change: false
    compatibility_constraint: direct return_from_upayments callers may lack the GET page marker used by PaymentLifecycle browser-mode inference; naive direct delegation is not authorized
  next_runtime_candidate:
    name: post-t3-ecosystem-hardening
    plan: docs/superpowers/plans/2026-09-10-post-t3-ecosystem-hardening.md
    preapproved_for_implementation: true
    scope: R0-R4 bounded evidence-first work only; R5/T4 remains separately gated
    latest_e3_runtime_checkpoint: 540b733c29656758f2392817649fc3d4a4db585d
    latest_e3_package_sha256: 01dbf672f9e18898a642a216b16fbf79dcc08511a617af9a8553d7341d87478c
    latest_e3_package_files: 55
    r0_status: done_verified
    r1_status: done_verified
    e1_status: done_verified
    generic_e2_status: done_certified
    e3_repository_status: done_verified
    e3_codeql_historical_status: nonterminal_hosted_default_setup
    current_gate: r2-callback-portability-cache-safety
    goal: Close R2 callback portability/cache safety, then subscription and scalability gaps; keep external vendor/infrastructure evidence bounded and do not treat T3 as authorization for T4 consolidation.

r2_contract:
  url_generation:
    authority: WooCommerce public WC-API URL abstraction
    forbid:
      - hand-built site_url callback origin
      - raw forwarded header trust
  cache:
    requirement: explicit no-cache behavior for public callback/status responses
  tdd: required
  non_scope:
    - payment authority redesign
    - R5/T4 callback consolidation

completion:
  runtime_tranche_gates:
    - Quality/H12 green
    - 20-cell Compatibility Matrix green
    - Ecosystem Certification green where applicable
    - Release Artifact green
    - Provider Sandbox green when applicable
    - WordPress.org Submission Check green
    - CodeQL/security green
    - locked dependency audit where applicable
    - zero unresolved valid review threads
    - post-merge main verification
  approach_3_closeout:
    - all approved modernization tranches merged
    - T4 implemented only if separately approved
    - no protected identity regression
    - remaining manual/external evidence explicitly classified
    - fresh-clone owner technical re-acceptance
    - new explicit owner-accepted Approach 3 baseline recorded
  public_release_authorized: false
